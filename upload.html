<input type="file" id="f">
<button onclick="up()">Upload</button>
<p id="out"></p>

<script>
const OWNER = "JewishKidsHub";   // check the exact name in your URL
const REPO  = "Assets";
const BRANCH = "main";

async function up() {
  const file = document.getElementById("f").files[0];
  if (!file) return;
  let token = localStorage.getItem("gh_token") ||
              prompt("Paste GitHub token");
  localStorage.setItem("gh_token", token);

  const b64 = await new Promise(r => {
    const fr = new FileReader();
    fr.onload = () => r(fr.result.split(",")[1]);
    fr.readAsDataURL(file);
  });

  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(file.name)}`;

  // If file already exists, GitHub needs its sha to overwrite
  let sha;
  const chk = await fetch(url + "?ref=" + BRANCH, {
    headers: { Authorization: "Bearer " + token }
  });
  if (chk.ok) sha = (await chk.json()).sha;

  const res = await fetch(url, {
    method: "PUT",
    headers: {
      Authorization: "Bearer " + token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: "Upload " + file.name,
      content: b64,
      branch: BRANCH,
      sha
    })
  });

  document.getElementById("out").textContent =
    res.ok ? "Uploaded ✅" : "Error: " + (await res.text());
}
</script>
