<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Not Found</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #222222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #111111;
        }
        p {
            font-size: 14px;
            color: #666666;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }
        .code {
            font-family: monospace;
            font-size: 12px;
            color: #888888;
            background-color: #f5f5f5;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .footer-logo {
            margin-top: 32px;
            opacity: 0.7;
        }
        .footer-logo img {
            max-width: 120px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404 - File Not Found</h1>
        <p>The requested asset could not be found on this server.</p>
        <span class="code">HTTP 404 NoSuchKey | static-asset-cdn</span>
        <div class="footer-logo">
            <img src="https://jewishkidshub.com/logo.png" alt="Jewish Kids Hub" onerror="this.style.display='none'">
        </div>
    </div>
</body>
</html>
